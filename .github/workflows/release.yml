name: Build and publish client update

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: microsoft
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Check required bundled dependencies
        shell: pwsh
        run: |
          foreach ($file in @('vendor/baritone-unoptimized-fabric-1.19.0.jar', 'vendor/baritone-1.19.0-source.zip', 'linux/vendor/baritone-unoptimized-fabric-1.19.0.jar', 'linux/vendor/baritone-1.19.0-source.zip')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required checked-in dependency: $file" }
          }
      - name: Build native component
        shell: pwsh
        run: ./native/build.ps1 -NoInstall
      - name: Check Windows client
        shell: pwsh
        run: |
          ./gradlew.bat check -Pnative --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Linux client
        working-directory: linux
        shell: pwsh
        run: |
          ../gradlew.bat -p . check --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer and matching update package
        shell: pwsh
        run: ./dist/build-bootstrapper.ps1 -Jdk $env:JAVA_HOME
      - name: Verify installer management
        shell: pwsh
        run: |
          python dist/check-management.py --test-java-home "$env:JAVA_HOME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python dist/publish-release.py --directory build/bootstrapper --repository "${{ github.repository }}" --publish
      - name: Retain build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-update
          path: |
            build/bootstrapper/UtilityClient-Setup-Updated.exe
            build/bootstrapper/UtilityClient-Update.zip
            build/bootstrapper/UtilityClient-Update.zip.sha256
          if-no-files-found: ignore
