plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	flatDir { dirs "vendor" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.latticg.com/" }
	maven { url "https://maven.seedfinding.com/" }
	maven { url "https://maven-snapshots.seedfinding.com/" }
	maven { url "https://jitpack.io" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"cheatclient" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// The complete 26.2 implementation, including Baritone's own nested pathfinder.
	include implementation("bundled:baritone-unoptimized-fabric:1.19.0") { transitive = false }
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// JNA for SetFileAttributesW, SetWindowDisplayAffinity and the stealth DLL.
	// jna core is NOT bundled: Fabric Loader already ships it to every mod, so the
	// classes resolve at runtime and the jar stays small. Compile-time only here.
	implementation "net.java.dev.jna:jna:5.17.0"
	// jna-platform is a different story: Fabric Loader does not ship it, so it has
	// to be nested in the jar or User32 is a NoClassDefFoundError at runtime.
	// 5.17.0 rather than 5.13.0 because this builds offline and 5.17.0 is the copy
	// already in the dependency cache; the API used here is identical in both.
	include implementation("net.java.dev.jna:jna-platform:5.17.0") { transitive = false }
	include implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") { transitive = false }
	include implementation("com.seedfinding:mc_math:${project.seedfinding_math_version}") { transitive = false }
	include implementation("com.seedfinding:mc_seed:${project.seedfinding_seed_version}") { transitive = false }
	include implementation("com.seedfinding:mc_core:${project.seedfinding_core_version}") { transitive = false }
	include implementation("com.seedfinding:mc_noise:${project.seedfinding_noise_version}") { transitive = false }
	include implementation("com.seedfinding:mc_biome:${project.seedfinding_biome_version}") { transitive = false }
	include implementation("com.seedfinding:mc_terrain:${project.seedfinding_terrain_version}") { transitive = false }
	include implementation("com.seedfinding:mc_feature:${project.seedfinding_feature_version}") { transitive = false }
	include implementation("com.seedfinding:mc_reversal:${project.seedfinding_reversal_version}") { transitive = false }
	include implementation("com.seedfinding:latticg:${project.latticg_version}")
}

loom {
	accessWidenerPath = file("src/main/resources/seedcrackerx.aw")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// ---- native stealth hook ----
// ucstealth.dll is MSVC + MinHook and ships inside the jar under a neutral name;
// StealthNative extracts it to %APPDATA%\depends\native on first use, so nothing
// has to be installed by hand.
//
// Opt-in through -Pnative. The window exclusion no longer needs it - that runs
// through JNA now - so the DLL is only the front-buffer swap hook, and a build
// machine without the C++ toolset should not spend a CMake configure, a MinHook
// fetch and a few hundred MB of intermediate objects finding that out.
//
// Deliberately non-fatal even when requested: the Java layer has a working
// fallback (hide its own drawing), so a missing toolchain produces a jar with no
// bundled DLL and a log line rather than a broken build.
def nativeStaging = layout.buildDirectory.dir('native')
def portableNative = project.hasProperty('nativeToolchain') && project.hasProperty('minHookSource')
def nativeScript = file(portableNative ? 'native/build-portable.ps1' : 'native/build.ps1')
def nativeRequested = project.hasProperty('native')
def windowsHost =
		System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('win')

tasks.register('buildNative', Exec) {
	mustRunAfter tasks.named('clean')
	group = 'build'
	description = 'Compiles ucstealth.dll into build/native for bundling (-Pnative).'
	onlyIf {
		nativeRequested && windowsHost && nativeScript.isFile()
	}
	workingDir = projectDir
	ignoreExitValue = false

	// Resolved at configuration time: the configuration cache refuses a Gradle
	// script object captured by an execution-time closure.
	def staged = nativeStaging.get().asFile
	def releaseDll = new File(projectDir, 'native/build/Release/ucstealth.dll')
	def debugDll = new File(projectDir, 'native/build/Debug/ucstealth.dll')

	doFirst {
		staged.mkdirs()
	}

	if (portableNative) {
		commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File',
				nativeScript.absolutePath, '-Toolchain', project.property('nativeToolchain').toString(),
				'-MinHook', project.property('minHookSource').toString()
	} else {
		commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
				'-File', nativeScript.absolutePath, '-NoInstall'
	}

	doLast {
		staged.mkdirs()
		def built = releaseDll.isFile() ? releaseDll : (debugDll.isFile() ? debugDll : null)
		if (built != null) {
			def target = new File(staged, 'ucstealth.dll')
			java.nio.file.Files.copy(built.toPath(), target.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			logger.lifecycle("staged ucstealth.dll (${built.length()} bytes)")
		} else {
			throw new GradleException('Requested native build did not produce ucstealth.dll')
		}
	}
}

processResources {
	dependsOn tasks.named('buildNative')

	// The resource name is neutral on purpose: a jar listing should not advertise
	// what the payload does. StealthNative holds the encrypted path.
	from(nativeStaging) {
		include 'ucstealth.dll'
		into 'assets/x'
		rename { 'r.bin' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	if (System.getenv('UC_LINT')) {
		it.options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-Xlint:-processing']
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('vendor') { include 'LICENSE-Baritone.txt', 'README.md'; into 'META-INF/third-party/baritone' }
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}

	// This jar is one thing only: a Fabric mod. The injector is its own build
	// (./gradlew -p injector jar) because an agent jar must not depend on Loom,
	// Minecraft, or anything else the target JVM would have to resolve.
	manifest {
		attributes(
			"Implementation-Title": "UtilityClient",
			"Implementation-Version": version
		)
	}
}

// Loom ships a remapped artifact written by its own archive task, whose manifest
// is not the one the `jar` block above configures - the distributable jar used to
// carry nothing but "Manifest-Version: 1.0". Stamping every Jar task covers
// whichever one ends up producing the file, without depending on Loom's internal
// task name (which is not `remapJar` in this version).
tasks.withType(Jar).configureEach {
	manifest {
		attributes(
			"Implementation-Title": "UtilityClient",
			"Implementation-Version": project.version
		)
	}
}

// A source fingerprint distinguishes rebuilt artifacts that share a version.
def sourceDigest = java.security.MessageDigest.getInstance('SHA-256')
fileTree('src').matching { include '**/*.java', '**/*.json', '**/*.aw' }.files
        .sort { a, b -> a.path <=> b.path }.each { source ->
    sourceDigest.update(projectDir.toPath().relativize(source.toPath()).toString().replace('\\', '/').getBytes('UTF-8'))
    sourceDigest.update(source.bytes)
}
def sourceFingerprint = sourceDigest.digest().encodeHex().toString()
tasks.withType(Jar).configureEach {
    manifest.attributes('Implementation-Source-SHA256': sourceFingerprint)
}

// GitHub rejects the .jar extension on release upload for some accounts. This packs
// the built mod as cheatclient.jar.zip; the injector's RemoteClient unpacks the jar
// back out, so the download side needs no explanation and no manual rename.
// What a friend downloads: both jars and the two installers, in one archive, no
// token and no source. The installers unpack into the same hidden folder the
// client reads, so nothing has to be configured by hand.
tasks.register('buildInjector', GradleBuild) {
    dir = file('injector')
    tasks = ['build']
}

tasks.register('bundle', Zip) {
    group = 'distribution'
    description = 'Builds the distributable archive: client jar, injector jar, installers.'
    archiveFileName = "UtilityClient-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('dist')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def injectorArtifact = rootProject.file('injector/build/libs/injector.jar')

    dependsOn tasks.named('jar'), tasks.named('buildInjector')

    from(tasks.named('jar')) { rename { 'cheatclient.jar' } }
    // The injector is a separate Gradle build, not a subproject: reference it by
    // path so the root build never needs an include it does not own.
    doFirst {
        if (!injectorArtifact.isFile())
            throw new GradleException('Injector build did not produce injector.jar')
    }
    from(rootProject.file('injector/build/libs/injector.jar')) { rename { 'injector.jar' } }
    from('dist') { include 'install.sh', 'install.ps1', 'install-artifacts.py', 'java-runtime.py', 'README.md' }
    from('vendor') { include 'LICENSE-Baritone.txt', 'README.md', 'baritone-1.19.0-source.zip'; into 'third-party/baritone' }
}

tasks.register('releaseZip', Zip) {
	dependsOn 'build'
	archiveFileName = 'cheatclient.jar.zip'
	destinationDirectory = layout.buildDirectory.dir('release')

	from(layout.buildDirectory.dir('libs')) {
		include 'cheatclient-*.jar'
		exclude '*-sources.jar', '*-dev.jar'
		rename { 'cheatclient.jar' }
	}
}

ext.utilityClientLinuxBundle = false
apply from: 'dist/bundle-checksums.gradle'

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}

sourceSets {
    regression {
        compileClasspath += sourceSets.client.output + sourceSets.main.output + configurations.clientCompileClasspath
        runtimeClasspath += sourceSets.client.output + sourceSets.main.output + configurations.clientRuntimeClasspath
    }
}
tasks.register('regressionCheck', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.baggute.cheatclient.InteractionMathChecks'
}
tasks.named('check') { dependsOn tasks.named('regressionCheck') }

// ---- automated audit wiring ----
// `./gradlew runClient -PbridgePort=7845 -PquickPlay="New World"` starts the dev
// client with the loopback test bridge listening on that port and drops straight
// into the named singleplayer world, so an audit run needs no clicks.
//
// Every property is optional and absent by default: a plain `runClient` is
// byte-for-byte the run it was before this block existed. The bridge itself is
// compiled into the jar and stays shut unless the system property is set, which
// only this block ever does.
//
// `-PquickPlay` takes the world *folder* name under run/saves, not the display
// name in level.dat — vanilla resolves the directory first.
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach { task ->
    if (project.hasProperty('gameHeap')) task.maxHeapSize = project.property('gameHeap').toString()
	if (project.hasProperty('bridgePort')) {
		task.systemProperty('utilityclient.bridge.port', project.property('bridgePort').toString())
	}
	if (project.hasProperty('quickPlay') && task.name == 'runClient') {
		task.args('--quickPlaySingleplayer', project.property('quickPlay').toString())
	}
	if (project.hasProperty('quickPlayMultiplayer') && task.name == 'runClient') {
		task.args('--quickPlayMultiplayer', project.property('quickPlayMultiplayer').toString())
	}
}
